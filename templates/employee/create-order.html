{% extends 'employee/layout.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2><i class="fa fa-plus-circle"></i> Tạo Đơn Hàng (Bán tại quầy / Hotline)</h2>
    <form action="{% url 'employee_create_order' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Tên khách hàng</label>
            <input type="text" name="customerName" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" name="customerPhone" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Địa chỉ giao hàng (Bỏ trống nếu mua trực tiếp)</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="form-group">
            <label>Chọn sản phẩm</label>
            <select name="productId" class="form-control" required>
                {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} - {{ p.price|currency }} (Tồn: {{ p.stock_quantity }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Số lượng</label>
            <input type="number" name="quantity" class="form-control" value="1" min="1" required>
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%; padding: 12px; font-weight: bold;">
            <i class="fa fa-check"></i> Xác nhận & Hoàn tất Đơn
        </button>
    </form>
</div>
{% endblock %}
