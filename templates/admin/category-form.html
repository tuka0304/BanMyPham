{% extends 'admin/layout.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2>{% if category.id %}Chỉnh sửa danh mục{% else %}Thêm danh mục mới{% endif %}</h2>
    <hr>
    
    <form action="{% url 'admin_save_category' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ category.id|default_if_none:'' }}">

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Tên danh mục:</label>
            <input type="text" name="name" value="{{ category.name|default_if_none:'' }}" class="form-control" 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
                   placeholder="Ví dụ: Son môi, Kem dưỡng da..." required>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn" 
                    style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                <i class="fas fa-save"></i> Lưu danh mục
            </button>
            <a href="{% url 'admin_categories' %}" 
               style="background: #ccc; color: #333; text-decoration: none; padding: 10px 20px; border-radius: 5px;"> Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
