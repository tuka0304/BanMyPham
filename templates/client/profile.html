{% extends 'client/base.html' %}

{% block title %}Hồ Sơ Cá Nhân - Aeterna{% endblock %}

{% block content %}
<div class="pt-24 pb-16 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-serif font-bold text-white mb-8">Hồ Sơ <span class="text-cosmetic-500">Cá Nhân</span></h2>
        
        <div class="glass-card p-8 rounded-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cosmetic-500 to-purple-500"></div>
            
            <form action="{% url 'profile_view' %}" method="post" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Tên đăng nhập</label>
                        <input type="text" value="{{ request.user.username }}" class="w-full bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-500 cursor-not-allowed" disabled>
                        <p class="text-xs text-gray-500 mt-1">Tên đăng nhập không thể thay đổi</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" name="email" value="{{ request.user.email }}" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cosmetic-500 transition">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Số điện thoại</label>
                        <input type="text" name="phone" value="{{ request.user.phone|default:'' }}" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cosmetic-500 transition">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-300 mb-2">Địa chỉ giao hàng mặc định</label>
                        <textarea name="address" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cosmetic-500 transition">{{ request.user.address|default:'' }}</textarea>
                    </div>
                </div>
                
                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-cosmetic-600 hover:bg-cosmetic-500 text-white px-8 py-3 rounded-xl transition font-medium shadow-lg shadow-cosmetic-500/20 flex items-center gap-2">
                        <i class="fa fa-save"></i> Cập Nhật Hồ Sơ
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
