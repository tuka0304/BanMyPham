{% extends 'employee/layout.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2><i class="fa fa-hand-holding-usd"></i> Gửi Đề Xuất Điều Chỉnh Giá</h2>
    <p style="color: #666; margin-bottom: 20px;">Đề xuất giá mới sẽ được gửi lên Admin để phê duyệt.</p>
    
    <form action="{% url 'employee_request_price' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Chọn sản phẩm</label>
            <select name="productId" class="form-control" required>
                {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} - Giá cũ: {{ p.price|currency }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Giá mới đề xuất (đ)</label>
            <input type="number" name="newPrice" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Lý do đề xuất</label>
            <textarea name="reason" class="form-control" rows="3" required placeholder="Khách mặc cả, hàng cận date, khuyến mãi hãng..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: bold;">
            <i class="fa fa-paper-plane"></i> Gửi Đề Xuất Cho Admin
        </button>
    </form>
</div>
{% endblock %}
